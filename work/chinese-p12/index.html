<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanzi Heroes 汉字 | Lolo Hub WORK HARD</title>
<meta name="description" content="Primary 1-2 Chinese characters on Lolo Hub: numbers 一 to 十 and first characters like 人 口 大 小 山 水 火 日 月, with sound and pictures.">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Patrick+Hand&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../../core/wallet.js"></script>
<script src="../kit/kit.js"></script>
<style>
  .hz { font: 700 clamp(90px, 26vw, 150px)/1.1 "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif SC", "SimSun", serif; color: #c0392b;
    display: inline-block; padding: 0 18px; background: linear-gradient(#0000 49.5%, #f2b8b8 49.5% 50.5%, #0000 50.5%), linear-gradient(90deg, #0000 49.5%, #f2b8b8 49.5% 50.5%, #0000 50.5%);
    border: 3px solid #f2b8b8; animation: stamp-in 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .py { font: 900 26px 'Nunito', sans-serif; color: var(--soft); }
  .choices.hzc button { font: 700 clamp(46px, 12vw, 64px)/1.1 "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif SC", serif; }
  .dots-row { font-size: clamp(30px, 8vw, 44px); line-height: 1.3; max-width: 420px; margin: 0 auto; }
  .study-grid .s-big { font-family: "KaiTi", "STKaiti", "Kaiti SC", serif; font-size: 52px; color: #c0392b; }
</style>
</head>
<body>
<script>
'use strict';
const { pick, shuffle, rnd, say } = LessonKit;
const NUMS = [['一', 'yī', 1], ['二', 'èr', 2], ['三', 'sān', 3], ['四', 'sì', 4], ['五', 'wǔ', 5], ['六', 'liù', 6], ['七', 'qī', 7], ['八', 'bā', 8], ['九', 'jiǔ', 9], ['十', 'shí', 10]];
const CHARS = [
  ['人', 'rén', '🧍', 'person'], ['口', 'kǒu', '👄', 'mouth'], ['大', 'dà', '🐘', 'big'], ['小', 'xiǎo', '🐭', 'small'],
  ['山', 'shān', '⛰️', 'mountain'], ['水', 'shuǐ', '💧', 'water'], ['火', 'huǒ', '🔥', 'fire'], ['日', 'rì', '☀️', 'sun'],
  ['月', 'yuè', '🌙', 'moon'], ['木', 'mù', '🌳', 'tree'], ['手', 'shǒu', '✋', 'hand'], ['目', 'mù', '👁️', 'eye'],
  ['耳', 'ěr', '👂', 'ear'], ['鱼', 'yú', '🐟', 'fish'], ['鸟', 'niǎo', '🐦', 'bird'], ['马', 'mǎ', '🐴', 'horse'],
  ['牛', 'niú', '🐮', 'cow'], ['羊', 'yáng', '🐑', 'sheep'], ['上', 'shàng', '⬆️', 'up'], ['下', 'xià', '⬇️', 'down'],
  ['雨', 'yǔ', '🌧️', 'rain'], ['花', 'huā', '🌸', 'flower'], ['田', 'tián', '🌾', 'field'], ['门', 'mén', '🚪', 'door'],
];
const others = (list, one, n) => shuffle(list.filter((x) => x !== one)).slice(0, n);
let deck = [];
function nextChar() { if (!deck.length) deck = shuffle(CHARS); return deck.pop(); }
function makeQ(i) {
  const t = i % 4;
  if (t === 3) { // count the things, pick the number
    const [hz, py, n] = pick(NUMS);
    const emo = pick(['🍎', '⭐', '🐼', '🎈', '🍬', '🐟']);
    const opts = shuffle([NUMS[n - 1], ...others(NUMS, NUMS[n - 1], 3)]);
    return { kind: 'choice', lang: 'zh', say: undefined, cols: 4, cls: 'hzc', ans: hz, sayAfter: hz,
      html: `<div class="q">Count them! Which number is it?</div><div class="dots-row">${emo.repeat(n)}</div>`,
      options: opts.map(([h]) => ({ label: h, value: h })), reveal: `${hz} ${py} (${n})` };
  }
  const c = nextChar();
  const [hz, py, emo, en] = c;
  const opts = shuffle([c, ...others(CHARS, c, 3)]);
  if (t === 0) { // see the character, pick the picture
    return { kind: 'choice', lang: 'zh', ans: hz, sayAfter: hz, cols: 2,
      html: `<div class="hz">${hz}</div><div class="q">What does it mean?</div>`,
      options: opts.map(([h, , e, n]) => ({ label: `<span style="font-size:1.7em">${e}</span><small>${n}</small>`, value: h })), reveal: `${emo} ${en} · ${py}` };
  }
  if (t === 1) { // hear it, pick the character
    return { kind: 'choice', lang: 'zh', say: hz, ans: hz, cols: 4, cls: 'hzc',
      html: `<div class="q">Listen! Which character is it?</div>`,
      options: opts.map(([h]) => ({ label: h, value: h })), reveal: `${hz} ${py}` };
  }
  // see the picture, pick the character
  return { kind: 'choice', lang: 'zh', ans: hz, sayAfter: hz, cols: 4, cls: 'hzc',
    html: `<div class="pic">${emo}</div><div class="q">Which character means <b>${en}</b>?</div>`,
    options: opts.map(([h]) => ({ label: h, value: h })), reveal: `${hz} ${py}` };
}
LessonKit.run({
  title: 'Hanzi Heroes 汉字',
  sub: 'Your first Chinese characters!',
  lang: 'zh',
  cheers: ['太棒了!', '好!', 'BOOM!', '对了!', 'SUPER!', '厉害!'],
  bits: ['★', '🐼', '🏮', '⭐', '🎉', '汉', '字'],
  perfect: '满分! Full marks, full gold!',
  study: {
    title: '汉字 · Study', sub: 'Tap a character to hear it.',
    render(el) {
      el.innerHTML = '<h2>🔢 Numbers</h2><div class="study-grid" id="sn"></div><h2>🌟 Characters</h2><div class="study-grid" id="sc"></div>';
      const card = (hz, py, emo, en) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = `<div class="s-big">${hz}</div><div class="s-small"><b>${py}</b></div><div class="s-pic">${emo}</div><div class="s-small">${en}</div>`;
        b.onclick = () => say(hz, 'zh', true);
        return b;
      };
      NUMS.forEach(([hz, py, n]) => el.querySelector('#sn').appendChild(card(hz, py, '', String(n))));
      CHARS.forEach(([hz, py, emo, en]) => el.querySelector('#sc').appendChild(card(hz, py, emo, en)));
    },
  },
  lessons: {
    hanzi: { id: 'p12-hanzi', emoji: '🏮', title: 'Hanzi Heroes', sub: 'Numbers 一 to 十 and 24 first characters.', count: 12, make: makeQ, reset: () => { deck = []; } },
  },
});
</script>
</body>
</html>
