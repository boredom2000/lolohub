<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14002a">
  <title>Lolo Kart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Google AdSense (H5 Games Ads): the hub's shared loader, configured in ../../core/ads.js -->
  <script src="../../core/ads.js"></script>
  <script src="../../core/wallet.js"></script>
</head>
<body class="menu">
  <div id="game"></div>

  <div id="corner">
    <button id="hubBtn" title="Back to the Lolo Hub">&#x2302; HUB</button>
    <button id="fsBtn" title="Full screen"><svg class="enter" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><svg class="exit" viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
  </div>
  <div id="cornerRight">
    <button id="muteBtn" title="Sound on/off">&#x1F50A;</button>
    <button id="pauseBtn" title="Pause">&#x275A;&#x275A;</button>
  </div>

  <!-- 1. driver select -->
  <section id="screenDriver" class="screen">
    <header>
      <h1 class="logo" data-text="LOLO KART">LOLO KART</h1>
      <h2>CHOOSE YOUR DRIVER</h2>
    </header>
    <div class="driver-body">
      <div class="preview-space"></div>
      <div id="driverInfo" class="panel">
        <div class="d-name" id="dName">LOLO</div>
        <div class="d-class" id="dClass">ALL-ROUNDER</div>
        <div class="gauges" id="gauges"></div>
        <button id="driverNext" class="big">NEXT &#9654;</button>
      </div>
    </div>
    <div id="driverGrid" class="cards"></div>
  </section>

  <!-- 2. track select -->
  <section id="screenTrack" class="screen hidden">
    <header>
      <h1 class="logo small" data-text="LOLO KART">LOLO KART</h1>
      <h2>CHOOSE A TRACK</h2>
    </header>
    <div id="trackGrid" class="tracks"></div>
    <div class="track-foot">
      <button id="trackBack" class="small">&#9664; BACK</button>
      <div id="trackDriver" class="track-driver"></div>
    </div>
  </section>

  <!-- 3. race HUD -->
  <div id="hud">
    <div id="lapBox"><small>LAP</small><span id="lapVal">1/3</span></div>
    <div id="timeBox"><span id="timeVal">0:00.00</span><small id="lapTimeVal"></small></div>
    <div id="posBox"><span id="posVal">8</span><sup id="posSuf">th</sup><small>/8</small></div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="speedo"><span id="speedVal">0</span><small>KM/H</small></div>
    <div id="countdown"></div>
    <div id="banner"></div>
    <div id="wrongWay">WRONG WAY!</div>
  </div>

  <!-- touch controls -->
  <div id="touch">
    <div id="wheel"><div class="wheel-img"><svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="none" stroke="#111" stroke-width="13"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="#19f7ff" stroke-width="8"/>
      <path d="M8 50h28M64 50h28M50 58v34" stroke="#19f7ff" stroke-width="9" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="13" fill="#ff2fd6" stroke="#111" stroke-width="3"/>
      <rect x="45" y="3" width="10" height="12" rx="3" fill="#ffe81a"/>
    </svg></div></div>
    <div id="pedals">
      <button id="brakeBtn" class="pedal">BRAKE</button>
      <button id="gasBtn" class="pedal">GAS</button>
    </div>
  </div>

  <!-- results -->
  <section id="results" class="overlay hidden">
    <div class="panel results-panel">
      <h2 id="resTitle">RESULTS</h2>
      <div id="resTrack" class="res-track"></div>
      <ol id="resList"></ol>
      <div class="row">
        <button id="resAgain" class="small">&#x21BB; RACE AGAIN</button>
        <button id="resTracks" class="big">TRACK SELECT</button>
      </div>
    </div>
  </section>

  <div id="pauseModal" class="overlay hidden">
    <div class="panel">
      <h2>PAUSED</h2>
      <div class="col">
        <button id="pResume" class="big">RESUME</button>
        <button id="pRestart" class="small">&#x21BB; RESTART</button>
        <button id="pQuit" class="small">QUIT TO TRACKS</button>
      </div>
    </div>
  </div>

  <div id="quitModal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
    <div class="panel">
      <h2 id="quitTitle">Back to the Hub?</h2>
      <p>Your race will be lost.</p>
      <div class="row">
        <button id="quitNo" class="small">Keep racing</button>
        <button id="quitYes" class="small danger">Leave</button>
      </div>
    </div>
  </div>

  <div id="rotateTip">Turn your phone sideways for a bigger view &#x21BB;</div>

  <script src="lib/three.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/drivers.js"></script>
  <script src="js/kartmodel.js"></script>
  <script src="js/track.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/controllers.js"></script>
  <script src="js/race.js"></script>
  <script src="js/net.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <!-- tracks: one folder each. Add a folder + a line here to add a track. -->
  <script src="tracks/01-sunny-circuit/track.js"></script>
  <script src="tracks/02-candy-canyon/track.js"></script>
  <script src="tracks/03-cloud-coaster/track.js"></script>
  <script src="tracks/04-volcano-vault/track.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
