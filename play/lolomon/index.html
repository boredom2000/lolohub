<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#12001f">
  <title>Ball Bandits</title>
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Bungee&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../core/arcade.css">
  <script src="../../core/ads.js"></script>
  <script src="../../core/wallet.js"></script>
  <script src="../../core/arcade.js"></script>
  <script src="../../core/duo.js"></script>
  <style>
    .arc-hud, #board, .tbtn { display: none; }
    body.playing .arc-hud, body.playing #board { display: flex; }
    body.playing.touch:not(.two) .tbtn { display: block; }
    .arc-hud { gap: 26px; }
    #board {
      position: fixed; z-index: 10; right: calc(12px + env(safe-area-inset-right)); top: calc(72px + env(safe-area-inset-top)); flex-direction: column; gap: 2px;
      font-size: 12px; min-width: 160px; padding: 8px 10px; border-radius: 12px; background: rgba(20, 0, 45, 0.6); border: 1px solid rgba(25, 247, 255, 0.4); pointer-events: none;
    }
    body.two #board { right: 50%; transform: translateX(50%); top: calc(10px + env(safe-area-inset-top)); }
    body.two .arc-hud { right: auto; left: 50%; transform: translateX(-50%); top: auto; bottom: calc(10px + env(safe-area-inset-bottom)); }
    body.two #sCoins { display: none; } /* each half of the split screen shows its own coins */
    body.two.touch .arc-hud { bottom: auto; top: calc(118px + env(safe-area-inset-top)); } /* the players' buttons own the bottom */
    #board div { display: flex; justify-content: space-between; gap: 10px; color: #d8c8ff; }
    #board div i { font-style: normal; }
    #board div.me { color: var(--yellow); text-shadow: 0 0 8px var(--orange); }
    #board b { font-family: 'Bungee', sans-serif; font-weight: 400; color: var(--cyan); font-size: 11px; letter-spacing: 1px; margin-bottom: 2px; }
    .tbtn {
      position: fixed; z-index: 11; right: calc(18px + env(safe-area-inset-right)); border-radius: 50%; color: #fff; font-family: 'Bungee', sans-serif; touch-action: none;
    }
    #grabBtn { bottom: calc(22px + env(safe-area-inset-bottom)); width: 96px; height: 96px; font-size: 17px; border: 3px solid var(--yellow); background: rgba(255, 232, 26, 0.22); box-shadow: 0 0 20px var(--orange); }
    #lockBtn { bottom: calc(132px + env(safe-area-inset-bottom)); width: 72px; height: 72px; font-size: 13px; border: 3px solid var(--cyan); background: rgba(25, 247, 255, 0.2); box-shadow: 0 0 16px var(--cyan); }
    #lockBtn.off { opacity: 0.35; }
    .tbtn:active { transform: scale(0.93); }
    @media (max-width: 560px) { .arc-hud { gap: 30px; } #board { min-width: 128px; font-size: 10px; top: calc(64px + env(safe-area-inset-top)); } }
  </style>
</head>
<body>
  <div class="arc-hud">
    <div class="arc-stat" id="sTime"><small>TIME</small><span>5:00</span></div>
    <div class="arc-stat" id="sCoins"><small>COINS</small><span>0</span></div>
  </div>
  <div id="board"></div>
  <button class="tbtn" id="lockBtn">LOCK</button>
  <button class="tbtn" id="grabBtn">GRAB</button>
<script>
'use strict';
// Ball Bandits: a big world with nests of Lolo Balls guarded by wild animals. Grab a ball (better while the guard
// naps), outrun the guard back to your base, and the ball hatches into a critter that makes coins. Rival bandits
// raid the wild too, and steal from bases: catch thieves to get your critters back, and lock your base for a while.
// After ROUND seconds the richest base (critters + coins) wins. All creatures are original, drawn in code.
// Modes: 1 player; 2P TEAM UP (P1 + P2 share the blue base); 2P VERSUS (P2 takes Rex's base). 2 players get a
// split screen (P1 left, P2 right) and the core/duo.js controls. Coins belong to a base, so teammates share them.
const { rnd, pick, clamp, sfx } = Arcade;
const W = 3600, H = 3600, CX = W / 2, CY = H / 2, ROUND = 300;
const BASE_W = 380, BASE_H = 260, LOCK_TIME = 15, LOCK_CD = 40, SPEED = 235, CARRY = 0.66;
const RINGS = { plaza: 640, meadow: 1180, forest: 1660 }; // beyond the forest: snow / desert / volcano / swamp
const view = Arcade.canvas();
const ctx = view.ctx;
const $ = (id) => document.getElementById(id);

const RAR = [
  { name: 'COMMON', col: '#7dff2f', price: [15, 35], inc: [1, 2], hatch: 5 },
  { name: 'RARE', col: '#19f7ff', price: [70, 130], inc: [4, 7], hatch: 8 },
  { name: 'EPIC', col: '#b44cff', price: [260, 420], inc: [13, 20], hatch: 11 },
  { name: 'LEGENDARY', col: '#ffd23f', price: [900, 1300], inc: [45, 65], hatch: 15 },
];
// wild guards per nest tier: speed (a player carrying a ball runs 155), how far they chase from the nest,
// how close you can sneak while they are awake, and how long they take to wake up when a ball is grabbed
const TIERS = [
  { animals: ['🐰', '🦆', '🐿️', '🐸'], speed: 140, leash: 520, notice: 0, wake: 1.2, cap: 2, respawn: 12 },
  { animals: ['🦊', '🐗', '🦉', '🦡'], speed: 170, leash: 650, notice: 110, wake: 1.5, cap: 2, respawn: 18 },
  { animals: ['🐺', '🐻', '🐊', '🦏'], speed: 190, leash: 800, notice: 140, wake: 1.8, cap: 1, respawn: 26 },
  { animals: ['🐉', '🦁'], speed: 205, leash: 1000, notice: 170, wake: 2.8, cap: 1, respawn: 45 },
];
const SPECIES = [
  [{ n: 'Sparkit', c: '#ffe14a', ear: 'pointy', tail: 'bolt' }, { n: 'Leaflet', c: '#6fdc5a', ear: 'leaf', tail: 'leaf' },
    { n: 'Bubbit', c: '#5ab8ff', ear: 'fin', tail: 'round' }, { n: 'Embit', c: '#ff8a3a', ear: 'flame', tail: 'flame' },
    { n: 'Pebblo', c: '#b0a8c4', ear: 'round', tail: 'none' }],
  [{ n: 'Frostail', c: '#c4f4ff', ear: 'pointy', tail: 'fluff' }, { n: 'Thornix', c: '#2f9e57', ear: 'horn', tail: 'leaf' },
    { n: 'Voltoad', c: '#c8f03a', ear: 'round', tail: 'bolt' }],
  [{ n: 'Blazewing', c: '#ff5040', ear: 'flame', tail: 'flame', wings: true }, { n: 'Aquadra', c: '#2fd6c0', ear: 'fin', tail: 'fluff', horn: true },
    { n: 'Shadowisp', c: '#8a4cff', ear: 'pointy', tail: 'wisp' }],
  [{ n: 'Starlune', c: '#fff1a8', ear: 'pointy', tail: 'fluff', horn: true, halo: true }, { n: 'Dracoray', c: '#ff4fd8', ear: 'horn', tail: 'wisp', wings: true }],
];
// the four bases (you: bottom-left) and who runs them in each mode
const BASES = [
  { name: 'YOU', col: '#19f7ff' }, { name: 'Rex', col: '#ff2fd6' }, { name: 'Mika', col: '#ffe81a' }, { name: 'Juno', col: '#7dff2f' },
];
const P2COL = '#ff2fd6';
// outer biomes by direction from the middle
const BIOMES = {
  top: { name: 'SNOW', col: '#2c3f66', decor: ['❄️', '⛄', '🌲', '🌲'] },
  right: { name: 'DESERT', col: '#5e4219', decor: ['🌵', '🌵', '🪨', '🦴'] },
  bottom: { name: 'VOLCANO', col: '#46121d', decor: ['🌋', '🔥', '🪨', '🪨'] },
  left: { name: 'SWAMP', col: '#173a36', decor: ['🌿', '🍄', '🪷', '🌿'] },
};

let G = null;
const keys = {};
const joy = { on: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const inRect = (p, r, m = 0) => p.x > r.x - m && p.x < r.x + r.w + m && p.y > r.y - m && p.y < r.y + r.h + m;
const inAnyBase = (p) => G.bases.some((b) => inRect(p, b, 10));
const humanBase = (i) => G.tr.some((t) => t.human && t.base === i);
const crew = (i) => G.tr.filter((t) => t.base === i);
function biomeAt(x, y) {
  const dx = x - CX, dy = y - CY;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'bottom' : 'top');
}

function newItem(tier) {
  let r = tier;
  if (tier < 3 && Math.random() < 0.12) r++; // now and then a nest holds something better
  const R = RAR[r], k = Math.random();
  const price = Math.round((R.price[0] + (R.price[1] - R.price[0]) * k) / 5) * 5;
  return { rar: r, sp: pick(SPECIES[r]), price, inc: +(R.inc[0] + (R.inc[1] - R.inc[0]) * k).toFixed(1), hatch: R.hatch, wob: rnd(0, 6) };
}

// four bases around the plaza (you: bottom-left), each with 8 pads and a door facing the middle street
function makeBase(i) {
  const xs = [CX - 70 - BASE_W, CX + 70], ys = [CY + 70, CY - 70 - BASE_H];
  const x = xs[i % 2], y = ys[i < 2 ? 0 : 1];
  const b = { i, x, y, w: BASE_W, h: BASE_H, top: y < CY, lockT: 0, lockCd: 0, coins: 0, pads: [], name: BASES[i].name, col: BASES[i].col };
  for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) b.pads.push({ base: i, x: x + 62 + c * 85, y: y + (b.top ? 70 : 90) + r * 100, item: null });
  return b;
}

function makeNests() {
  const nests = [];
  const free = (x, y, gap) => nests.every((n) => Math.hypot(n.x - x, n.y - y) > gap);
  const add = (tier, x, y) => {
    const T = TIERS[tier];
    const n = { x, y, tier, cap: T.cap, balls: [], respawnT: 0 };
    for (let k = 0; k < T.cap; k++) n.balls.push(newItem(tier));
    n.guard = { nest: n, x: x + rnd(-50, 50), y: y + rnd(30, 60), emoji: pick(T.animals), state: Math.random() < 0.5 ? 'sleep' : 'awake',
      t: rnd(2, 8), target: null, why: null, face: 1, wx: x, wy: y };
    nests.push(n);
  };
  const ring = (tier, count, r0, r1) => {
    for (let tries = 0, made = 0; made < count && tries < 3000; tries++) {
      const a = rnd(0, Math.PI * 2), r = rnd(r0, r1);
      const x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r;
      if (x < 160 || y < 160 || x > W - 160 || y > H - 160 || !free(x, y, 300)) continue;
      add(tier, x, y); made++;
    }
  };
  ring(0, 10, RINGS.plaza + 120, RINGS.meadow - 60);
  ring(1, 8, RINGS.meadow + 80, RINGS.forest - 60);
  ring(2, 8, RINGS.forest + 120, 2350);
  // the legendary lairs: two far corners
  const corners = [[260, 260], [W - 260, 260], [260, H - 260], [W - 260, H - 260]].sort(() => Math.random() - 0.5);
  for (const [x, y] of corners.slice(0, 2)) add(3, x, y);
  return nests;
}

function makeDecor() {
  const out = [];
  for (let k = 0; k < 520; k++) {
    const x = rnd(40, W - 40), y = rnd(40, H - 40), r = Math.hypot(x - CX, y - CY);
    if (r < RINGS.plaza + 40) continue;
    const e = r < RINGS.meadow ? pick(['🌼', '🌷', '🌳', '🌼']) : r < RINGS.forest ? pick(['🌲', '🌳', '🍄', '🌲']) : pick(BIOMES[biomeAt(x, y)].decor);
    out.push({ x, y, e, s: rnd(22, 38) });
  }
  return out;
}

function trainer(base, name, col, human, pad) {
  const b = G.bases[base];
  return { base, name, col, human, pad, x: b.x + b.w / 2 + (pad === 1 ? 40 : 0), y: b.top ? b.y + b.h - 30 : b.y + 30, carry: null, stun: 0,
    bot: !human, goal: null, think: rnd(0, 0.3), stealT: rnd(20, 40), mode: 'idle', target: null, face: 1, step: 0,
    speed: human ? SPEED : SPEED * rnd(0.86, 0.92) };
}
function start(mode) {
  mode = mode || 'solo';
  G = { mode, two: mode !== 'solo', t: ROUND, fx: [], floats: [], over: false, stolen: 0, caught: 0, wild: 0, nests: makeNests(), decor: makeDecor() };
  G.bases = [0, 1, 2, 3].map(makeBase);
  if (mode === 'versus') { G.bases[0].name = 'P1'; G.bases[1].name = 'P2'; G.bases[1].col = P2COL; }
  if (mode === 'coop') G.bases[0].name = 'P1+P2';
  G.tr = [trainer(0, mode === 'solo' ? 'YOU' : 'P1', BASES[0].col, true, 0)];
  G.tr.push(mode === 'versus' ? trainer(1, 'P2', P2COL, true, 1) : trainer(1, 'Rex', BASES[1].col, false));
  G.tr.push(trainer(2, 'Mika', BASES[2].col, false), trainer(3, 'Juno', BASES[3].col, false));
  if (mode === 'coop') G.tr.push(trainer(0, 'P2', P2COL, true, 1));
  // every base starts with one hatched critter so coins start flowing
  for (const b of G.bases) { const it = newItem(0); it.rar = 0; it.hatch = 0; b.pads[0].item = it; }
  document.body.classList.toggle('two', G.two);
  if (G.two) Duo.start(); else Duo.stop();
  document.body.classList.add('playing');
  Arcade.banner('BALL BANDITS', mode === 'coop' ? 'TEAM UP · GRAB · RUN · HATCH!' : mode === 'versus' ? 'P1 vs P2 · GRAB · RUN · HATCH!' : 'GRAB · RUN · HATCH!');
  sfx.up();
}

/* ---------- items in bases ---------- */
const value = (b) => b.pads.reduce((s, p) => s + (p.item ? p.item.price : 0), 0);
const worth = (b) => value(b) + Math.floor(b.coins);
// put an item in a base: empty pad, else replace the weakest if better (sold for half), else sell it for half
function place(b, item) {
  let pad = b.pads.find((p) => !p.item);
  if (!pad) {
    const weak = b.pads.reduce((a, p) => (p.item.price < a.item.price ? p : a));
    if (weak.item.price >= item.price) { sell(b, item, weak); return null; }
    sell(b, weak.item, weak);
    pad = weak;
  }
  pad.item = item;
  return pad;
}
function sell(b, item, at) {
  const gain = Math.round(item.price / 2);
  b.coins += gain;
  float(at.x, at.y - 30, `SOLD +${gain}`, '#ffd23f');
}
// what a carrier drops when caught goes back where it came from: its nest, or the base it was stolen from
function returnCarry(t) {
  const c = t.carry;
  if (!c) return null;
  t.carry = null;
  if (c.nest) { if (c.nest.balls.length < c.nest.cap) c.nest.balls.push(c.item); }
  else if (c.from >= 0) place(G.bases[c.from], c.item);
  return c.item;
}
function stun(t, from, time) {
  t.stun = time;
  const a = Math.atan2(t.y - from.y, t.x - from.x) || rnd(0, 6);
  t.x = clamp(t.x + Math.cos(a) * 60, 20, W - 20); t.y = clamp(t.y + Math.sin(a) * 60, 20, H - 20);
  burst(t.x, t.y, '#ffffff', 14);
}

/* ---------- actions ---------- */
function act(t) {
  if (t.carry || t.stun > 0) return false;
  // grab from a wild nest
  let nest = null, nd = t.bot ? 46 : 64;
  for (const n of G.nests) { const d = dist(n, t); if (n.balls.length && d < nd) { nd = d; nest = n; } }
  if (nest) {
    const item = nest.balls.pop();
    t.carry = { item, from: -1, nest };
    alarm(nest.guard, t);
    if (t.human) { sfx.pop(1.2); float(t.x, t.y - 60, RAR[item.rar].name + '!', RAR[item.rar].col); }
    return true;
  }
  // steal from a rival base
  for (const b of G.bases) {
    if (b.i === t.base || !inRect(t, b)) continue;
    let pad = null, pd = t.bot ? 44 : 60;
    for (const p of b.pads) { const d = dist(p, t); if (p.item && d < pd) { pd = d; pad = p; } }
    if (!pad) return false;
    t.carry = { item: pad.item, from: b.i };
    pad.item = null;
    sfx.pop(1.4);
    if (humanBase(b.i)) { Arcade.banner('THIEF!', `${t.name} grabbed ${b.name === 'YOU' ? 'your' : b.name + '’s'} ${t.carry.item.sp.n}`, '#ff2fd6'); sfx.lose(); }
    return true;
  }
  return false;
}

function lock(t) {
  const b = G.bases[t.base];
  if (b.lockCd > 0 || !inRect(t, b, 20)) return false;
  b.lockT = LOCK_TIME; b.lockCd = LOCK_CD;
  sfx.arp([300, 600, 900], 0.05, 'sawtooth', 0.1);
  if (t.human) float(t.x, t.y - 50, 'LOCKED!', '#19f7ff');
  return true;
}

/* ---------- wild guards ---------- */
function alarm(g, t) {
  if (g.state === 'chase' || g.state === 'alarm') return;
  const asleep = g.state === 'sleep';
  g.target = t; g.why = 'ball';
  g.t = asleep ? TIERS[g.nest.tier].wake : 0.25;
  g.state = 'alarm';
  if (t.human) sfx.tone(asleep ? 300 : 500, 0.2, 'sawtooth', 0.12, 300);
}
function updateGuard(g, dt) {
  const T = TIERS[g.nest.tier], n = g.nest;
  const move = (tx, ty, sp) => {
    const dx = tx - g.x, dy = ty - g.y, d = Math.hypot(dx, dy);
    if (d > 2) { g.x += dx / d * Math.min(d, sp * dt); g.y += dy / d * Math.min(d, sp * dt); if (Math.abs(dx) > 1) g.face = dx > 0 ? 1 : -1; }
    return d;
  };
  g.t -= dt;
  if (g.state === 'sleep') { if (g.t <= 0) { g.state = 'awake'; g.t = rnd(4, 7); } return; }
  if (g.state === 'awake') {
    if (g.t <= 0) { g.state = 'sleep'; g.t = rnd(5, 9); return; }
    if (move(g.wx, g.wy, 50) < 4) { g.wx = n.x + rnd(-70, 70); g.wy = n.y + rnd(-50, 70); }
    if (T.notice) for (const t of G.tr) {
      if (t.stun > 0 || inAnyBase(t) || dist(t, g) > T.notice) continue;
      g.state = 'chase'; g.target = t; g.why = 'intruder';
      if (t.human) sfx.tone(500, 0.2, 'sawtooth', 0.12, 300);
      break;
    }
    return;
  }
  if (g.state === 'alarm') { if (g.t <= 0) g.state = 'chase'; return; }
  if (g.state === 'chase') {
    const t = g.target;
    const lost = !t || inAnyBase(t) || dist(g, n) > T.leash || t.stun > 0 ||
      (g.why === 'ball' && (!t.carry || t.carry.nest !== n));
    if (lost) { g.state = 'return'; g.target = null; return; }
    if (move(t.x, t.y, T.speed) < 30) {
      const item = returnCarry(t);
      stun(t, g, item ? 1.4 : 0.9);
      g.state = 'return'; g.target = null;
      if (t.human) { Arcade.banner(G.two ? `${t.name} CAUGHT!` : 'CAUGHT!', item ? `the ${g.emoji} took its ball back` : `watch out for the ${g.emoji}`, '#ff2fd6'); sfx.boom(); }
    }
    return;
  }
  // return home, then nap a little
  if (move(n.x, n.y + 40, T.speed * 0.6) < 6) { g.state = 'awake'; g.t = rnd(2, 4); }
}

/* ---------- bots ---------- */
function think(b) {
  const home = G.bases[b.base];
  const homeSpot = { x: home.x + home.w / 2, y: home.top ? home.y + home.h - 40 : home.y + 40 };
  if (b.mode !== 'steal' && b.mode !== 'raid') b.target = null;
  if (b.carry) { b.mode = 'home'; b.goal = { x: home.x + home.w / 2, y: home.y + home.h / 2 }; return; }
  const thief = G.tr.find((t) => t.carry && t.carry.from === b.base);
  if (thief && dist(b, thief) < 900) { b.mode = 'chase'; b.goal = { x: thief.x, y: thief.y }; return; }
  const intruder = G.tr.find((t) => t.base !== b.base && !t.carry && inRect(t, home, 40));
  if (intruder && home.lockCd <= 0) {
    if (inRect(b, home, 20)) lock(b); else if (dist(b, home) < 700) { b.mode = 'defend'; b.goal = homeSpot; return; }
  }
  // keep going for the current target while it is still there
  if (b.mode === 'steal' && b.target && b.target.item && !G.bases[b.target.base].lockT && G.t > b.giveUp) { b.goal = b.target; return; }
  if (b.mode === 'raid' && b.target && b.target.balls.length && G.t > b.giveUp) { b.goal = b.target; return; }
  // now and then: steal the best item of an unlocked base whose crew is away
  if (b.stealT <= 0) {
    b.stealT = rnd(12, 24);
    let best = null;
    for (const base of G.bases) {
      if (base.i === b.base || base.lockT > 0) continue;
      const guards = crew(base.i);
      for (const p of base.pads) if (p.item && guards.every((o) => dist(o, p) > 200) && (!best || p.item.price > best.item.price)) best = p;
    }
    if (best && best.item.price > 30 && Math.random() < 0.75) { b.mode = 'steal'; b.target = best; b.goal = best; b.giveUp = G.t - 20; return; }
  }
  // raid a wild nest: bigger rewards further out, braver as the round goes on
  const elapsed = ROUND - G.t, maxTier = elapsed < 50 ? 0 : elapsed < 120 ? 1 : elapsed < 190 ? 2 : 3;
  const empty = home.pads.some((p) => !p.item);
  const weak = empty ? 0 : Math.min(...home.pads.map((p) => p.item.price));
  let best = null, score = 0;
  for (const n of G.nests) {
    if (!n.balls.length || n.tier > maxTier || n.balls[n.balls.length - 1].price <= weak) continue;
    if (G.tr.some((t) => t !== b && t.target === n)) continue; // someone is already going there
    const safe = n.guard.state === 'sleep' ? 1 : n.guard.state === 'awake' ? 0.6 : 0.2;
    const s = n.balls[n.balls.length - 1].price * safe / (dist(b, n) + 500);
    if (s > score) { score = s; best = n; }
  }
  if (best) { b.mode = 'raid'; b.target = best; b.goal = best; b.giveUp = G.t - 35; return; }
  b.mode = 'idle'; b.target = null;
  if (!b.goal || dist(b, b.goal) < 10 || Math.random() < 0.05) b.goal = { x: homeSpot.x + rnd(-120, 120), y: homeSpot.y + (home.top ? rnd(20, 120) : rnd(-120, -20)) };
}

/* ---------- update ---------- */
function update(dt) {
  if (!G || G.over) return;
  G.t -= dt;
  if (G.t <= 0) return end();
  if (G.two) Duo.update();

  // nests refill
  for (const n of G.nests) {
    if (n.balls.length >= n.cap) { n.respawnT = TIERS[n.tier].respawn; continue; }
    n.respawnT -= dt;
    if (n.respawnT <= 0) {
      n.respawnT = TIERS[n.tier].respawn;
      n.balls.push(newItem(n.tier));
      if (n.tier === 3) { Arcade.banner('LEGENDARY!', `a golden ball appeared at the ${n.guard.emoji} lair`, RAR[3].col); sfx.fanfare(); }
    }
  }
  for (const n of G.nests) updateGuard(n.guard, dt);

  // bases: locks, hatching, income
  for (const b of G.bases) {
    b.lockT = Math.max(0, b.lockT - dt); b.lockCd = Math.max(0, b.lockCd - dt);
    for (const p of b.pads) {
      const it = p.item; if (!it) continue;
      if (it.hatch > 0) {
        it.hatch -= dt;
        if (it.hatch <= 0) { burst(p.x, p.y, RAR[it.rar].col, 22); if (humanBase(b.i)) { sfx.up(); float(p.x, p.y - 40, `${it.sp.n}!`, RAR[it.rar].col); } }
      } else b.coins += it.inc * dt;
    }
  }

  // move trainers
  for (const t of G.tr) {
    t.stun = Math.max(0, t.stun - dt);
    let mx = 0, my = 0;
    if (t.human && G.two) {
      const pad = Duo.pad(t.pad);
      mx = pad.x; my = pad.y;
      if (pad.aPressed) act(t);
      if (pad.bPressed && !lock(t)) sfx.hit();
    } else if (t.human) {
      if (keys.ArrowLeft || keys.KeyA) mx -= 1; if (keys.ArrowRight || keys.KeyD) mx += 1;
      if (keys.ArrowUp || keys.KeyW) my -= 1; if (keys.ArrowDown || keys.KeyS) my += 1;
      if (joy.on) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy); if (d > 8) { mx = dx / Math.max(d, 45); my = dy / Math.max(d, 45); } }
    } else {
      t.think -= dt; t.stealT -= dt;
      if (t.think <= 0) { t.think = rnd(0.25, 0.4); think(t); }
      if (t.goal) { const dx = t.goal.x - t.x, dy = t.goal.y - t.y, d = Math.hypot(dx, dy); if (d > 6) { mx = dx / d; my = dy / d; } }
      if ((t.mode === 'steal' || t.mode === 'raid') && t.target && dist(t, t.target) < 40) { act(t); t.mode = 'idle'; t.target = null; }
    }
    const m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; }
    if (t.stun > 0) mx = my = 0;
    const sp = t.speed * (t.carry ? CARRY : 1);
    t.x = clamp(t.x + mx * sp * dt, 20, W - 20);
    t.y = clamp(t.y + my * sp * dt, 20, H - 20);
    if (mx) t.face = mx > 0 ? 1 : -1;
    t.step += Math.hypot(mx, my) * dt * 10;
    // locked bases push out everyone but their own crew
    for (const b of G.bases) if (b.lockT > 0 && b.i !== t.base && inRect(t, b, 14)) pushOut(t, b);
    // carrying home: deliver
    if (t.carry && inRect(t, G.bases[t.base], -10)) {
      const c = t.carry;
      t.carry = null;
      const pad = place(G.bases[t.base], c.item);
      if (pad) burst(pad.x, pad.y, RAR[c.item.rar].col, 12);
      if (t.human) {
        sfx.coin();
        if (c.from >= 0) { G.stolen++; Arcade.banner('STOLEN!', `${c.item.sp.n} is ${G.two ? t.name + '’s' : 'yours'} now`, '#7dff2f'); }
        else { G.wild++; float(t.x, t.y - 60, 'SAFE!', '#7dff2f'); }
      }
    }
  }
  // anyone from the robbed base catches a thief carrying their stuff
  for (const thief of G.tr) {
    if (!thief.carry || thief.carry.from < 0) continue;
    const owner = crew(thief.carry.from).find((o) => o.stun <= 0 && dist(o, thief) <= 34);
    if (!owner) continue;
    const it = returnCarry(thief);
    stun(thief, owner, 1.3);
    if (owner.human) { G.caught++; Arcade.banner('GOT IT BACK!', `${it.sp.n} is home again`, '#7dff2f'); sfx.up(); }
    else if (thief.human) { Arcade.banner('CAUGHT!', `${owner.name} took it back`, '#ff2fd6'); sfx.boom(); }
    else sfx.hit();
  }
  // light bumping between trainers
  for (let a = 0; a < G.tr.length; a++) for (let b = a + 1; b < G.tr.length; b++) {
    const A = G.tr[a], B = G.tr[b], d = dist(A, B);
    if (d > 0 && d < 28) { const push = (28 - d) / 2, nx = (B.x - A.x) / d, ny = (B.y - A.y) / d; A.x -= nx * push; A.y -= ny * push; B.x += nx * push; B.y += ny * push; }
  }

  for (const f of G.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; f.life -= dt; }
  G.fx = G.fx.filter((f) => f.life > 0);
  for (const f of G.floats) { f.y -= 40 * dt; f.life -= dt; }
  G.floats = G.floats.filter((f) => f.life > 0);
  hud();
}

function pushOut(t, b) {
  const l = t.x - (b.x - 14), r = b.x + b.w + 14 - t.x, u = t.y - (b.y - 14), d = b.y + b.h + 14 - t.y, m = Math.min(l, r, u, d);
  if (m === l) t.x = b.x - 15; else if (m === r) t.x = b.x + b.w + 15; else if (m === u) t.y = b.y - 15; else t.y = b.y + b.h + 15;
}
function burst(x, y, col, n) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(60, 260); G.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col, life: rnd(0.4, 0.9) }); } }
function float(x, y, text, col) { G.floats.push({ x, y, text, col, life: 1.2 }); }

let lastBoard = '';
function hud() {
  const me = G.tr[0], base = G.bases[0];
  Arcade.stat('sTime', Arcade.fmtTime(Math.max(0, G.t)));
  Arcade.stat('sCoins', Math.floor(base.coins).toLocaleString());
  const rows = G.bases.map((b) => ({ b, w: worth(b) })).sort((a, b) => b.w - a.w)
    .map((r, k) => `<div class="${humanBase(r.b.i) ? 'me' : ''}"><i>${k + 1}. ${r.b.name}</i><i>${r.w.toLocaleString()}</i></div>`).join('');
  const html = '<b>RICHEST BASE</b>' + rows;
  if (html !== lastBoard) { $('board').innerHTML = html; lastBoard = html; }
  const lb = $('lockBtn');
  lb.textContent = base.lockT > 0 ? Math.ceil(base.lockT) + 's' : base.lockCd > 0 ? Math.ceil(base.lockCd) : 'LOCK';
  lb.classList.toggle('off', base.lockCd > 0 || !inRect(me, base, 20));
}

function end() {
  G.over = true;
  Duo.stop();
  document.body.classList.remove('playing');
  const ranks = G.bases.map((b) => ({ b, w: worth(b) })).sort((a, b) => b.w - a.w);
  const rankOf = (i) => ranks.findIndex((r) => r.b.i === i) + 1;
  const my = G.bases[0], crit = my.pads.filter((p) => p.item).length;
  const list = ranks.map((r, k) => `${k + 1}. ${r.b.name} ${r.w.toLocaleString()}`).join(' &nbsp; ');
  if (G.mode === 'versus') {
    const w1 = worth(G.bases[0]), w2 = worth(G.bases[1]);
    Arcade.over({ title: w1 > w2 ? 'P1 WINS!' : w2 > w1 ? 'P2 WINS!' : 'DRAW!', stats: `P1 <b>${w1.toLocaleString()}</b> · P2 <b>${w2.toLocaleString()}</b><br>${list}` });
    return;
  }
  const place1 = rankOf(0);
  Arcade.over({
    title: place1 === 1 ? (G.two ? 'TOP BANDITS!' : 'TOP BANDIT!') : `#${place1} PLACE`,
    lose: place1 > 1,
    stats: `Base worth <b>${worth(my).toLocaleString()}</b> · Critters <b>${crit}</b><br>Wild balls <b>${G.wild}</b> · Stolen <b>${G.stolen}</b> · Saved <b>${G.caught}</b><br>${list}`,
    score: G.two ? null : worth(my),
  });
}

/* ---------- drawing ---------- */
function drawBall(x, y, r, rar, t) {
  const col = RAR[rar].col;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t) * 0.15);
  ctx.shadowColor = col; ctx.shadowBlur = rar ? 14 : 6;
  ctx.fillStyle = '#f4f0ff'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.fill();
  // Lolo Balls have a star, not a button
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; star(-r * 0.4, -r * 0.5, r * 0.22);
  ctx.fillStyle = '#2b1640'; ctx.fillRect(-r, -r * 0.12, r * 2, r * 0.24);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = col; star(0, 0, r * 0.24);
  ctx.strokeStyle = '#2b1640'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function star(x, y, r) {
  ctx.beginPath();

  ctx.closePath(); ctx.fill();
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = (v) => clamp(Math.round(v * k), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function drawCritter(sp, x, y, s, t) {
  const c = sp.c, dark = shade(c, 0.6), bob = Math.sin(t * 3) * 2 * s;
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#2b1640'; ctx.lineJoin = 'round';
  if (sp.halo) { ctx.strokeStyle = '#ffe81a'; ctx.shadowColor = '#ffe81a'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.ellipse(0, -30, 14, 5, 0, 0, Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0; ctx.strokeStyle = '#2b1640'; }
  if (sp.wings) { ctx.fillStyle = dark; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 12, -4); ctx.quadraticCurveTo(d * 34, -26 + Math.sin(t * 8) * 6, d * 30, 2); ctx.quadraticCurveTo(d * 24, -2, d * 12, 6); ctx.fill(); ctx.stroke(); } }
  ctx.fillStyle = sp.tail === 'flame' ? '#ff7a1a' : sp.tail === 'wisp' ? 'rgba(200,160,255,0.8)' : dark;
  ctx.beginPath();
  if (sp.tail === 'bolt') { ctx.moveTo(14, 4); ctx.lineTo(26, -6); ctx.lineTo(22, 0); ctx.lineTo(32, -12); ctx.lineTo(24, 8); ctx.lineTo(28, 2); ctx.closePath(); }
  else if (sp.tail === 'leaf') { ctx.ellipse(24, -2, 10, 5, -0.6, 0, Math.PI * 2); }
  else if (sp.tail === 'fluff') { ctx.arc(22, 0, 9, 0, Math.PI * 2); }
  else if (sp.tail === 'flame' || sp.tail === 'wisp') { ctx.moveTo(14, 6); ctx.quadraticCurveTo(30, 0, 26 + Math.sin(t * 9) * 3, -16); ctx.quadraticCurveTo(22, 0, 14, -2); }
  else if (sp.tail === 'round') { ctx.arc(18, 6, 5, 0, Math.PI * 2); }
  if (sp.tail !== 'none') { ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = sp.ear === 'flame' ? '#ff7a1a' : sp.ear === 'leaf' ? '#3fb84a' : sp.ear === 'horn' ? '#fff6d0' : c;
  for (const d of [-1, 1]) {
    ctx.beginPath();
    if (sp.ear === 'pointy') { ctx.moveTo(d * 6, -14); ctx.lineTo(d * 14, -30); ctx.lineTo(d * 15, -10); }
    else if (sp.ear === 'leaf') { ctx.ellipse(d * 10, -20, 5, 10, d * 0.5, 0, Math.PI * 2); }
    else if (sp.ear === 'fin') { ctx.moveTo(d * 12, -10); ctx.quadraticCurveTo(d * 24, -18, d * 20, -2); }
    else if (sp.ear === 'flame') { ctx.moveTo(d * 4, -14); ctx.quadraticCurveTo(d * 10, -34 - Math.sin(t * 10 + d) * 3, d * 12, -12); }
    else if (sp.ear === 'horn') { ctx.moveTo(d * 5, -15); ctx.lineTo(d * 9, -28); ctx.lineTo(d * 11, -13); }
    else { ctx.arc(d * 11, -13, 6, 0, Math.PI * 2); }

  }

  ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, 17, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(0, 6, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
  const blink = (t * 0.7 + x * 0.01) % 4 < 0.1;
  ctx.fillStyle = '#2b1640';
  for (const d of [-1, 1]) {
    if (blink) ctx.fillRect(d * 6 - 3, -4, 6, 2);
    else { ctx.beginPath(); ctx.ellipse(d * 6, -3, 3, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(d * 6 + 1, -5, 1.3, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#2b1640'; }
  }
  ctx.fillStyle = 'rgba(255,90,140,0.55)'; ctx.beginPath(); ctx.arc(-11, 3, 3, 0, Math.PI * 2); ctx.arc(11, 3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2b1640'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(0, 2, 3, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
}
function drawItem(it, x, y, s, t) {
  if (it.hatch > 0) {
    const shake = it.hatch < 2 ? Math.sin(t * 30) * 0.5 : 0;
    drawBall(x, y, 15 * s, it.rar, t * 2 + it.wob + shake * 4);
  } else drawCritter(it.sp, x, y, s * 1.15, t + it.wob);
}

function drawTrainer(t, now) {
  ctx.save(); ctx.translate(t.x, t.y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, 14, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  if (t.stun > 0) ctx.globalAlpha = 0.5 + Math.sin(now * 30) * 0.3;
  const legs = Math.sin(t.step) * 4;
  ctx.strokeStyle = '#2b1640'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-5, 4); ctx.lineTo(-5 + legs, 14); ctx.moveTo(5, 4); ctx.lineTo(5 - legs, 14); ctx.stroke();
  ctx.fillStyle = t.col; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, -2, 11, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd9b8'; ctx.beginPath(); ctx.arc(0, -18, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = t.col; ctx.beginPath(); ctx.arc(0, -20, 9.5, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.fillRect(t.face > 0 ? 0 : -14, -21, 14, 4);
  ctx.fillStyle = '#2b1640'; ctx.beginPath(); ctx.arc(t.face * 3.5, -17, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  if (t.stun > 0) { ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText('💫', Math.sin(now * 8) * 8, -36); }
  ctx.font = '11px Bungee, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = t.human ? '#fff' : t.col; ctx.fillText(t.name, 0, -34);
  ctx.restore();
  if (t.carry) drawItem(t.carry.item, t.x, t.y - 52, 1, now);
}

function drawGuard(g, now) {
  const T = TIERS[g.nest.tier], size = 42 + g.nest.tier * 10;
  ctx.save(); ctx.translate(g.x, g.y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, size * 0.35, size * 0.45, size * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  if (g.state === 'chase') { ctx.shadowColor = '#ff2fd6'; ctx.shadowBlur = 18; }
  const hop = g.state === 'chase' ? Math.abs(Math.sin(now * 14)) * -6 : g.state === 'sleep' ? 0 : Math.abs(Math.sin(now * 4)) * -2;
  ctx.scale(-g.face, 1); // emoji animals face left
  ctx.font = `${size}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; // solid, or the emoji comes out see-through
  ctx.fillText(g.emoji, 0, hop);
  ctx.restore();
  ctx.font = '14px Bungee, sans-serif'; ctx.textAlign = 'center';
  if (g.state === 'sleep') { ctx.fillStyle = '#b8f8ff'; ctx.fillText('z', g.x + 16 + Math.sin(now * 2) * 3, g.y - size * 0.6 - (now * 12) % 10); ctx.fillText('Z', g.x + 26, g.y - size * 0.8 - (now * 12 + 5) % 10); }
  else if (g.state === 'chase' || g.state === 'alarm') {
    ctx.font = '22px Bungee, sans-serif'; ctx.fillStyle = '#ff2fd6'; ctx.fillText('!', g.x, g.y - size * 0.75 + Math.sin(now * 20) * 2);
  }
  // the area an awake guard watches
  if (g.state === 'awake' && T.notice) {
    ctx.strokeStyle = 'rgba(255,47,214,0.25)'; ctx.setLineDash([6, 8]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(g.x, g.y, T.notice, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
}
function drawNest(n, now) {
  ctx.fillStyle = '#5a3a1e'; ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(n.x, n.y + 10, 40, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  for (let k = 0; k < 6; k++) { const a = k * 1.05; ctx.beginPath(); ctx.moveTo(n.x + Math.cos(a) * 30, n.y + 10 + Math.sin(a) * 10); ctx.lineTo(n.x + Math.cos(a + 0.8) * 42, n.y + 6 + Math.sin(a + 0.8) * 14); ctx.stroke(); }
  n.balls.forEach((it, k) => drawBall(n.x + (k - (n.balls.length - 1) / 2) * 28, n.y, 14, it.rar, now * 2 + it.wob));
  if (n.tier === 3) { ctx.font = '12px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = RAR[3].col; ctx.fillText('LEGENDARY LAIR', n.x, n.y + 48); }
}

function drawBase(b, now) {
  const col = b.col;
  ctx.fillStyle = 'rgba(30,10,60,0.92)'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.globalAlpha = 0.85;
  const dy = b.top ? b.y + b.h : b.y, gy = b.top ? b.y : b.y + b.h, door = 110, mid = b.x + b.w / 2;
  ctx.beginPath();
  ctx.moveTo(b.x, dy); ctx.lineTo(b.x, gy); ctx.lineTo(b.x + b.w, gy); ctx.lineTo(b.x + b.w, dy);
  ctx.moveTo(b.x, dy); ctx.lineTo(mid - door / 2, dy); ctx.moveTo(mid + door / 2, dy); ctx.lineTo(b.x + b.w, dy);
  ctx.stroke(); ctx.globalAlpha = 1;
  ctx.font = '18px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = col;
  ctx.fillText(b.name === 'YOU' ? 'YOUR BASE' : `${b.name.toUpperCase()}'S BASE`, mid, b.top ? b.y + 28 : b.y + b.h - 12);
  for (const p of b.pads) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 14, 30, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (p.item) {
      drawItem(p.item, p.x, p.y, 1, now);
      ctx.font = '10px Orbitron, sans-serif'; ctx.fillStyle = p.item.hatch > 0 ? '#fff' : RAR[p.item.rar].col;
      ctx.fillText(p.item.hatch > 0 ? `${Math.ceil(p.item.hatch)}s` : `+${p.item.inc}/s`, p.x, p.y + 38);
    }
  }
  if (b.lockT > 0) {
    ctx.strokeStyle = '#19f7ff'; ctx.lineWidth = 5; ctx.shadowColor = '#19f7ff'; ctx.shadowBlur = 18;
    ctx.setLineDash([14, 8]); ctx.lineDashOffset = -now * 60; ctx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
    ctx.setLineDash([]); ctx.shadowBlur = 0;
    ctx.font = '14px Bungee, sans-serif'; ctx.fillStyle = '#19f7ff';
    ctx.fillText(`LOCKED ${Math.ceil(b.lockT)}`, mid, b.top ? b.y - 14 : b.y + b.h + 26);
  }
}

function drawGround() {
  // outer biomes: four triangles from the middle, then forest, meadow and plaza rings
  const tri = (ax, ay, bx, by, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(ax, ay); ctx.lineTo(bx, by); ctx.closePath(); ctx.fill(); };
  tri(0, 0, W, 0, BIOMES.top.col); tri(W, 0, W, H, BIOMES.right.col); tri(W, H, 0, H, BIOMES.bottom.col); tri(0, H, 0, 0, BIOMES.left.col);
  const ring = (r, col, edge) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 6; ctx.stroke(); };
  ring(RINGS.forest, '#123a24', 'rgba(125,255,47,0.25)');
  ring(RINGS.meadow, '#1f5230', 'rgba(125,255,47,0.35)');
  ring(RINGS.plaza, '#241040', 'rgba(25,247,255,0.5)');
  ctx.strokeStyle = 'rgba(180,76,255,0.15)'; ctx.lineWidth = 2;
  for (let x = CX - RINGS.plaza; x <= CX + RINGS.plaza; x += 80) { const h = Math.sqrt(Math.max(0, RINGS.plaza ** 2 - (x - CX) ** 2)); ctx.beginPath(); ctx.moveTo(x, CY - h); ctx.lineTo(x, CY + h); ctx.stroke(); }
  for (let y = CY - RINGS.plaza; y <= CY + RINGS.plaza; y += 80) { const w = Math.sqrt(Math.max(0, RINGS.plaza ** 2 - (y - CY) ** 2)); ctx.beginPath(); ctx.moveTo(CX - w, y); ctx.lineTo(CX + w, y); ctx.stroke(); }
  ctx.strokeStyle = '#ff2fd6'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, W - 8, H - 8);
  ctx.font = '40px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillText(BIOMES.top.name, CX, 220); ctx.fillText(BIOMES.bottom.name, CX, H - 200);
  ctx.fillText(BIOMES.left.name, 260, CY); ctx.fillText(BIOMES.right.name, W - 260, CY);
}

function drawMinimap(x0, y0, size) {
  const m = size / W;
  ctx.save(); ctx.translate(x0, y0);
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(10,0,25,0.8)'; ctx.fillRect(-3, -3, size + 6, size + 6);
  ctx.scale(m, m);
  const tri = (ax, ay, bx, by, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(ax, ay); ctx.lineTo(bx, by); ctx.closePath(); ctx.fill(); };
  tri(0, 0, W, 0, BIOMES.top.col); tri(W, 0, W, H, BIOMES.right.col); tri(W, H, 0, H, BIOMES.bottom.col); tri(0, H, 0, 0, BIOMES.left.col);
  for (const [r, c] of [[RINGS.forest, '#123a24'], [RINGS.meadow, '#1f5230'], [RINGS.plaza, '#241040']]) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fill(); }
  for (const b of G.bases) { ctx.fillStyle = b.col; ctx.fillRect(b.x, b.y, b.w, b.h); }
  ctx.globalAlpha = 1;
  for (const n of G.nests) {
    if (!n.balls.length) continue;
    ctx.fillStyle = RAR[Math.max(...n.balls.map((it) => it.rar))].col;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.tier === 3 ? 90 : 60, 0, Math.PI * 2); ctx.fill();
  }
  for (const n of G.nests) if (n.guard.state === 'chase') { ctx.fillStyle = '#ff2fd6'; ctx.fillRect(n.guard.x - 40, n.guard.y - 40, 80, 80); }
  for (const t of G.tr) {
    if (t.human) continue;
    const robbing = t.carry && t.carry.from >= 0 && humanBase(t.carry.from);
    ctx.fillStyle = robbing ? '#ff2fd6' : t.col;
    ctx.beginPath(); ctx.arc(t.x, t.y, robbing ? 90 : 55, 0, Math.PI * 2); ctx.fill();
  }
  for (const t of G.tr) {
    if (!t.human) continue;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = t.col; ctx.lineWidth = 30;
    ctx.beginPath(); ctx.arc(t.x, t.y, 80, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(25,247,255,0.6)'; ctx.lineWidth = 2; ctx.strokeRect(x0 - 3, y0 - 3, size + 6, size + 6);
}

// arrow at the edge of a viewport toward something off screen
function arrowTo(p, vp, cam, z, col, label) {
  const sx = (p.x - cam.x) * z + vp.w / 2, sy = (p.y - cam.y) * z + vp.h / 2;
  if (sx > 30 && sx < vp.w - 30 && sy > 30 && sy < vp.h - 30) return;
  const a = Math.atan2(sy - vp.h / 2, sx - vp.w / 2);
  const ex = clamp(vp.w / 2 + Math.cos(a) * vp.w, 36, vp.w - 36), ey = clamp(vp.h / 2 + Math.sin(a) * vp.h, G.two ? 120 : 250, vp.h - (G.two ? 120 : 36));
  ctx.save(); ctx.translate(vp.x + ex, vp.y + ey); ctx.rotate(a);
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -11); ctx.lineTo(-10, 11); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.font = '11px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = col;
  ctx.fillText(label, vp.x + ex - Math.cos(a) * 30, vp.y + ey - Math.sin(a) * 24);
}

// one camera view of the world, following trainer `me`, drawn into the screen rectangle vp
function drawView(me, vp, now) {
  const z = clamp(Math.max(vp.w, vp.h) / 1150, 0.5, 1.25);
  const cam = { x: clamp(me.x, vp.w / 2 / z, W - vp.w / 2 / z), y: clamp(me.y, vp.h / 2 / z, H - vp.h / 2 / z) };
  const vis = (x, y, m = 80) => Math.abs(x - cam.x) < vp.w / 2 / z + m && Math.abs(y - cam.y) < vp.h / 2 / z + m;
  ctx.save();
  ctx.beginPath(); ctx.rect(vp.x, vp.y, vp.w, vp.h); ctx.clip();
  ctx.translate(vp.x + vp.w / 2, vp.y + vp.h / 2); ctx.scale(z, z); ctx.translate(-cam.x, -cam.y);
  drawGround();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; // emoji take the fill colour's transparency: keep it solid
  for (const d of G.decor) if (vis(d.x, d.y)) { ctx.font = `${d.s}px serif`; ctx.fillText(d.e, d.x, d.y); }
  ctx.textBaseline = 'alphabetic';
  for (const n of G.nests) if (vis(n.x, n.y, 120)) drawNest(n, now);
  for (const b of G.bases) if (vis(b.x + b.w / 2, b.y + b.h / 2, 300)) drawBase(b, now);
  // prompt over what this player can grab
  if (!me.carry && !G.over && me.stun <= 0) {
    let hint = null;
    for (const n of G.nests) if (n.balls.length && dist(n, me) < 64) {
      const top = n.balls[n.balls.length - 1];
      hint = { x: n.x, y: n.y - 40, t: n.guard.state === 'sleep' ? `GRAB ${RAR[top.rar].name}` : 'GRAB… IT SEES YOU!', c: n.guard.state === 'sleep' ? RAR[top.rar].col : '#ff2fd6' };
      break;
    }
    if (!hint) for (const b of G.bases) if (b.i !== me.base && inRect(me, b)) for (const p of b.pads) if (p.item && dist(p, me) < 60) { hint = { x: p.x, y: p.y - 40, t: 'STEAL!', c: '#ff2fd6' }; break; }
    if (hint) {
      const key = Arcade.touch ? '' : G.two ? (me.pad ? 'ENTER: ' : 'SPACE: ') : 'SPACE: ';
      ctx.font = '13px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = hint.c; ctx.shadowColor = hint.c; ctx.shadowBlur = 10;
      ctx.fillText(key + hint.t, hint.x, hint.y - Math.abs(Math.sin(now * 5)) * 5); ctx.shadowBlur = 0;
    }
  }
  const actors = G.tr.map((t) => ({ y: t.y, d: () => drawTrainer(t, now) }));
  for (const n of G.nests) if (vis(n.guard.x, n.guard.y, 200)) actors.push({ y: n.guard.y, d: () => drawGuard(n.guard, now) });
  actors.sort((a, b) => a.y - b.y).forEach((a) => a.d());
  for (const f of G.fx) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.col; ctx.fillRect(f.x - 3, f.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  for (const f of G.floats) { ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.font = '15px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // arrows: home when carrying, thieves running off with this player's critters
  ctx.save(); ctx.beginPath(); ctx.rect(vp.x, vp.y, vp.w, vp.h); ctx.clip();
  const home = G.bases[me.base];
  if (me.carry) arrowTo({ x: home.x + home.w / 2, y: home.y + home.h / 2 }, vp, cam, z, '#19f7ff', 'HOME');
  for (const t of G.tr) if (t.carry && t.carry.from === me.base) arrowTo(t, vp, cam, z, '#ff2fd6', 'THIEF');
  if (G.two) { // name + this player's base coins in the bottom corner of their half
    ctx.font = '18px Bungee, sans-serif'; ctx.textAlign = me.pad ? 'right' : 'left'; ctx.fillStyle = me.col;
    ctx.shadowColor = me.col; ctx.shadowBlur = 10;
    ctx.fillText(`${me.name} · ${Math.floor(G.bases[me.base].coins).toLocaleString()} 🪙`, me.pad ? vp.x + vp.w - 14 : vp.x + 14, vp.y + vp.h - (Arcade.touch ? 112 : 14));
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function draw() {
  const now = performance.now() / 1000;
  ctx.fillStyle = '#12001f'; ctx.fillRect(0, 0, view.w, view.h);
  if (!G) return;
  const humans = G.tr.filter((t) => t.human);
  if (G.two) {
    // split screen: P1 left, P2 right (the touch controls are split the same way)
    const half = Math.floor(view.w / 2);
    for (const h of humans) drawView(h, { x: h.pad ? half : 0, y: 0, w: h.pad ? view.w - half : half, h: view.h }, now);
    ctx.fillStyle = '#ff2fd6'; ctx.fillRect(half - 2, 0, 4, view.h);
    const size = Math.min(130, Math.round(Math.min(view.w, view.h) * 0.22));
    drawMinimap(half - size / 2, view.h - size - (Arcade.touch ? 130 : 70), size);
  } else {
    drawView(humans[0], { x: 0, y: 0, w: view.w, h: view.h }, now);
    drawMinimap(12, 62, Math.min(170, Math.round(Math.min(view.w, view.h) * 0.3)));
  }
  if (joy.on) {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, Math.PI * 2); ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    ctx.fillStyle = 'rgba(25,247,255,0.5)'; ctx.beginPath(); ctx.arc(joy.ox + Math.cos(a) * d, joy.oy + Math.sin(a) * d, 20, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- input (1 player; 2 players go through core/duo.js) ---------- */
const playing = () => !!G && !G.over;
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (!playing() || G.two || Arcade.paused || document.querySelector('.lolo-gate')) return;
  if (e.code === 'Space' || e.code === 'KeyE') { e.preventDefault(); if (!e.repeat) act(G.tr[0]); }
  if (e.code === 'KeyL' || e.code === 'KeyQ') { if (!lock(G.tr[0])) sfx.hit(); }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy.on = false; });
view.cv.addEventListener('pointerdown', (e) => { if (Duo.on) return; joy.on = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; });
addEventListener('pointermove', (e) => { if (joy.on && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const up = (e) => { if (e.pointerId === joy.id) joy.on = false; };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
$('grabBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); if (playing() && !Arcade.paused) act(G.tr[0]); });
$('lockBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); if (playing() && !Arcade.paused && !lock(G.tr[0])) sfx.hit(); });

Duo.init({ a: 'GRAB', b: 'LOCK' });
Arcade.init({
  id: 'lolomon',
  logo: ['BALL', 'BANDITS'],
  tag: 'Explore a big wild world! Lolo Balls sit in nests guarded by wild animals: grab one (best while the guard naps) and run home before it catches you. Balls hatch into critters that make coins. Steal from rival bases, chase thieves, lock your base. Richest base after 5 minutes wins!',
  helpDesk: '<b>WASD</b> / <b>arrows</b> move · <b>Space</b> grab or steal · <b>L</b> lock your base (stand in it)<br><b>2 players</b> (split screen): P1 <b>WASD</b> + <b>Space</b> grab + <b>G</b> lock · P2 <b>arrows</b> + <b>Enter</b> grab + <b>.</b> lock',
  helpTouch: '<b>Drag</b> to move · <b>GRAB</b> grabs or steals · <b>LOCK</b> locks your base (stand in it)<br><b>2 players:</b> each one uses their half of the screen',
  modes: [{ id: 'solo', label: '1 PLAYER' }, { id: 'coop', label: '2P TEAM UP' }, { id: 'versus', label: '2P VERSUS' }],
  quitNote: 'This round will end.',
  start,
  playing,
});
Arcade.loop(update, draw);
</script>
</body>
